name: bublik-n

services:

  postgres:
    # Storage images are immutable by default. A routine recreate must never
    # move a production data volume to a different database binary merely
    # because an upstream floating tag was retargeted.
    image: ${BUBLIK_POSTGRES_IMAGE:-postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416}
    container_name: bublik-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bublik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-bublik}
    volumes:
      - pg_data:/var/lib/postgresql/data
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5


  redis:
    image: ${BUBLIK_REDIS_IMAGE:-redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065}
    container_name: bublik-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


  bot:
    image: ${BUBLIK_IMAGE:-bublik-n-bot:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bublik-bot
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379
      # Ordinary service starts can never inherit migration-only mode from
      # .env. The audited one-off command overrides this explicitly with -e.
      MIGRATE_ONLY: "0"
      BUBLIK_HEALTH_FILE: /tmp/bublik-health.json
      BUBLIK_HEALTH_MAX_AGE_MS: "75000"
      # A normal service start can never inherit the one-time baseline flag
      # from .env. The audited migration-only command must override this
      # explicitly with `docker compose run -e PRISMA_BASELINE_EXISTING=1`.
      PRISMA_BASELINE_EXISTING: "0"
    volumes:
      - ./logs:/app/logs
      - ./locales:/app/locales:ro

volumes:
  pg_data:
    name: bublik-n_pg_data
  redis_data:
    name: bublik-n_redis_data
