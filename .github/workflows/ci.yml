name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: source-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bublik_ci?schema=public
      DISCORD_TOKEN: ci-test-token
      DISCORD_CLIENT_ID: "000000000000000000"
      REDIS_URL: redis://127.0.0.1:6379
      NODE_ENV: test
    services:
      postgres:
        image: postgres@sha256:20edbde7749f822887a1a022ad526fde0a47d6b2be9a8364433605cf65099416
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bublik_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bublik_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis@sha256:8b81dd37ff027bec4e516d41acfbe9fe2460070dc6d4a4570a2ac5b9d59df065
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Exercise legacy baseline verifier
        env:
          RUN_DB_BASELINE_INTEGRATION: "1"
        run: npm run test:baseline

      - name: Apply and verify migrations
        run: |
          npx prisma migrate deploy
          npx prisma migrate diff --from-schema-datasource prisma/schema.prisma --to-schema-datamodel prisma/schema.prisma --exit-code
          test "$(node scripts/verify-baseline-target.js)" = "already-applied"

      - name: Verify hardening migration postflight
        run: node scripts/snapshot-baseline-data.js --postflight

      - name: Pin Redis noeviction policy
        env:
          REDIS_CONTAINER_ID: ${{ job.services.redis.id }}
        run: |
          test -n "$REDIS_CONTAINER_ID"
          test "$(docker exec "$REDIS_CONTAINER_ID" redis-cli CONFIG SET maxmemory-policy noeviction)" = "OK"
          test "$(docker exec "$REDIS_CONTAINER_ID" redis-cli --raw CONFIG GET maxmemory-policy | tail -n 1 | tr -d '\r')" = "noeviction"

      - name: Database + Redis integration smoke test
        env:
          RUN_DB_INTEGRATION: "1"
          ALLOWED_GUILDS: integration-whitelist-guild
        run: npm run test:integration

      - name: Required data-gate integration (no skips)
        env:
          RUN_DATA_GATE_INTEGRATION: "1"
        run: npm run test:data-gate

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Audit runtime deps
        run: npm audit --omit=dev

      - name: Build production artifact
        run: npm run build:protected

      - name: Build and smoke-test production image
        run: |
          docker build -t bublik-bot:ci .
          test "$(docker image inspect bublik-bot:ci --format '{{.Config.User}}')" = "node"
          docker image inspect bublik-bot:ci |
            docker run --rm -i --entrypoint node bublik-bot:ci -e '
              let input="";
              process.stdin.on("data",chunk=>input+=chunk).on("end",()=>{
                const image=JSON.parse(input)[0];
                const health=image.Config.Healthcheck;
                const env=new Set(image.Config.Env);
                if(JSON.stringify(health.Test)!==JSON.stringify([
                     "CMD","node","dist/core/HealthMarker.js","--check"
                   ])||health.Interval!==15000000000||health.Timeout!==5000000000||
                   health.StartPeriod!==60000000000||health.Retries!==3||
                   !env.has("BUBLIK_HEALTH_FILE=/tmp/bublik-health.json")||
                   !env.has("BUBLIK_HEALTH_MAX_AGE_MS=75000"))process.exit(1);
              });
            '
          if docker run --rm --entrypoint node bublik-bot:ci \
            dist/core/HealthMarker.js --check >/dev/null 2>&1; then
            echo 'Image healthcheck unexpectedly passed without PID 1 and a fresh marker' >&2
            exit 1
          fi
          docker run --rm --entrypoint node bublik-bot:ci -e "const fs=require('node:fs');if(process.getuid()===0)process.exit(1);for(const file of ['./dist/index.js','./dist/core/HealthMarker.js','./scripts/verify-baseline-target.js','./scripts/snapshot-baseline-data.js'])fs.accessSync(file,fs.constants.R_OK);require('@prisma/client');require('discord.js')"
          docker run --rm --entrypoint sh bublik-bot:ci -c '
            set -eu
            test -f dist/index.js
            test -n "$(find dist -type f -name "*.js" -print -quit)"
            test -z "$(find dist \( -type d -name __tests__ -o -type f \( -name "*.d.ts" -o -name "*.map" -o -name "*.test.js" -o -name "*.spec.js" \) \) -print -quit)"
            if find dist -type f -name "*.js" -exec grep -l "sourceMappingURL=" {} \; | grep -q .; then exit 1; fi
            find dist -type f -name "*.js" -exec node --check {} \;
          '
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" -e MIGRATE_ONLY=1 -e PRISMA_BASELINE_EXISTING=0 bublik-bot:ci
          test "$(docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" --entrypoint node bublik-bot:ci scripts/verify-baseline-target.js)" = "already-applied"
          image_postflight="$RUNNER_TEMP/bublik-image-postflight.json"
          docker run --rm --network host -e DATABASE_URL="$DATABASE_URL" --entrypoint node bublik-bot:ci scripts/snapshot-baseline-data.js --postflight > "$image_postflight"
          node -e 'const fs=require("node:fs");const report=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));if(report.status!=="ok"||report.checks.length!==31||report.checks.some(check=>check.violations!=="0")||report.skippedChecks.length!==0)process.exit(1)' "$image_postflight"
